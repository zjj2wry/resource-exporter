apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-exporter
  namespace: volcano-system
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
  - apiGroups: ["nodeinfo.volcano.sh"]
    resources: ["numatopologies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-exporter-bind
subjects:
  - kind: ServiceAccount
    name: resource-exporter-account
    namespace: volcano-system
roleRef:
  kind: ClusterRole
  name: resource-exporter
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-exporter-account
  namespace: volcano-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: resource-exporter-daemonset
  namespace: volcano-system
spec:
  selector:
    matchLabels:
      name: resource-topology
  template:
    metadata:
      labels:
        name: resource-topology
    spec:
      nodeSelector:
        dewu.com/service: "gpu"
      tolerations:
        - effect: NoSchedule
          key: dewu.com/service
          value: gpu
      serviceAccountName: resource-exporter-account
      containers:
        - name: resource-topology
          image: <internal>/numatopo:gpu-support-debug
          imagePullPolicy: Always
          args:
            - --logtostderr
            - --kubelet-conf=/host/kubeletconf/ack-managed-config.yaml
            - --cpu-manager-state=/host/kubelet/cpu_manager_state
            - --device-path=/host/device
            - -v=6
            - 2>&1
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: node-path
              mountPath: "/host/device"
            - name: kubelet-path
              mountPath: "/host/kubelet"
            - name: kubelet-config-path
              mountPath: "/host/kubeletconf"
            - name: sys-devices
              mountPath: "/host/sys/devices"
              readOnly: true
            - name: sys-bus-pci
              mountPath: "/host/sys/bus/pci"
              readOnly: true
            - name: proc-nvidia
              mountPath: "/host/proc/driver/nvidia"
              readOnly: true
      volumes:
        - name: node-path
          hostPath:
            path: "/sys/devices/system"
        - name: kubelet-path
          hostPath:
            path: "/var/lib/kubelet"
        - name: kubelet-config-path
          hostPath:
            path: "/var/lib/kubelet"
        - name: sys-devices
          hostPath:
            path: "/sys/devices"
        - name: sys-bus-pci
          hostPath:
            path: "/sys/bus/pci"
        - name: proc-nvidia
          hostPath:
            path: "/proc/driver/nvidia"
